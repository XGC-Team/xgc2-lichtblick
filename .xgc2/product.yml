schema: xgc2.product.v1
id: xgc2-lichtblick
name: XGC2 Lichtblick
version: 1.27.0-xgc2.1
kind: mixed
summary: XGC2-maintained Lichtblick source product for high-performance live robotics visualization.
groups:
- webui
usage:
  install: |-
    corepack yarn install --immutable
    ./xgc2/scripts/build-web.sh
  smoke_test: |-
    node --test xgc2/tests/test_lichtblick_web.js
    corepack yarn test packages/suite-base/src/panels/ThreeDeeRender/transforms/TransformTree.test.ts --runInBand
    corepack yarn test packages/suite-base/src/players/FoxgloveWebSocketPlayer/worker.test.ts --runInBand
  notes: >-
    Source and browser runtime are maintained together. Lichtblick is no longer
    installed or released through the XGC2 APT pipeline.
